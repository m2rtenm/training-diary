name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: training-diary-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Check dependency advisories
        run: npm audit --audit-level=low

      - name: Validate Cognito build configuration
        env:
          COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          COGNITO_HOSTED_UI: ${{ vars.COGNITO_HOSTED_UI }}
        run: |
          test -n "$COGNITO_AUTHORITY" || { echo "Missing COGNITO_AUTHORITY repository variable"; exit 1; }
          test -n "$COGNITO_CLIENT_ID" || { echo "Missing COGNITO_CLIENT_ID repository variable"; exit 1; }
          test -n "$COGNITO_HOSTED_UI" || { echo "Missing COGNITO_HOSTED_UI repository variable"; exit 1; }

      - name: Build PWA
        run: npm run build
        env:
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_HOSTED_UI: ${{ vars.COGNITO_HOSTED_UI }}

      - name: Upload production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: training-diary-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: training-diary-dist
          path: dist/

      - name: Validate deploy configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          DEPLOY_BUCKET_NAME: ${{ vars.DEPLOY_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Missing AWS_DEPLOY_ROLE_ARN secret"; exit 1; }
          test -n "$DEPLOY_BUCKET_NAME" || { echo "Missing DEPLOY_BUCKET_NAME repository variable"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "Missing CLOUDFRONT_DISTRIBUTION_ID repository variable"; exit 1; }

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stride-${{ github.run_id }}
          aws-region: eu-north-1
          allowed-account-ids: '565393049153'

      - name: Deploy static app to S3
        env:
          DEPLOY_BUCKET_NAME: ${{ vars.DEPLOY_BUCKET_NAME }}
        run: aws s3 sync dist/ "s3://${DEPLOY_BUCKET_NAME}/" --delete --only-show-errors

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
